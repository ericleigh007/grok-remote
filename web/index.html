<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Grok Remote</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="auth-screen" class="screen">
    <div class="card auth-card">
      <h1>Grok Remote</h1>
      <p class="muted">
        Prefer no typing: on the PC open <code>/pair</code> and scan the QR with this phone
        (Tailscale connected). Token is saved automatically.
      </p>
      <label>
        Token <span class="muted">(fallback only)</span>
        <input id="token-input" type="password" autocomplete="current-password" placeholder="remote token" />
      </label>
      <button id="auth-btn" class="primary">Connect</button>
      <p id="auth-error" class="error hidden"></p>
    </div>
  </div>

  <div id="app" class="screen hidden">
    <header class="topbar">
      <div class="brand">
        <strong>Grok Remote</strong>
        <span id="conn-status" class="pill warn">connecting…</span>
      </div>
      <div class="top-actions">
        <select id="tts-voice" class="voice-select" title="TTS voice" aria-label="TTS voice"></select>
        <button id="catch-up" class="exit-btn" title="Catch up from the PC session" aria-label="Catch up from PC">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="#fff" d="M18 3h3v18h-3v-2h1V5h-1z"/>
            <path fill="#fff" d="M13.2 11.2h3.4v1.6h-3.4zM16.2 9.2L20.2 12 16.2 14.8z"/>
            <circle fill="#fff" cx="8.6" cy="6.9" r="1.7"/>
            <path fill="#fff" d="M7.4 9.2h3l2.4 3-1.4 1-1.8-2v5H7.4zM7.2 9.6L4.4 12.2 5.6 13.4 8.2 11.2zM9.4 15.8l3.4 4.6-1.6.8-2.8-4-2.2 4-1.6-1 3-4.4z"/>
          </svg>
        </button>
        <button id="tts-toggle" class="ghost" title="Read replies aloud">TTS on</button>
        <button id="think-beep-toggle" class="ghost" title="Short beep while Grok is thinking">Beep off</button>
        <button id="new-session" class="ghost" title="New session">+ Session</button>
      </div>
    </header>

    <div id="session-tabs" class="tabs"></div>

    <div id="session-picker" class="session-picker hidden">
      <h2>Re-enter a session</h2>
      <p class="muted small">Search titles, folders, and transcripts. Only the session you open is loaded.</p>
      <input id="session-search" type="search" placeholder="Search sessions…" autocomplete="off" enterkeyhint="search" />
      <p id="session-search-status" class="muted small hidden"></p>
      <div id="session-picker-list"></div>
      <button id="show-all-sessions" class="ghost">Show all sessions</button>
      <button id="picker-new-session" class="ghost">New session</button>
    </div>

    <div id="chat-wrap" class="chat-wrap">
      <main id="chat" class="chat" aria-live="polite"></main>
      <button id="scroll-latest" type="button" class="latest-btn hidden" title="Scroll to latest" aria-label="Scroll to latest">↓</button>
    </div>

    <div id="tool-line" class="tool-line hidden"></div>
    <div id="user-question" class="user-question hidden"></div>

    <footer class="composer">
      <div class="composer-row">
        <button id="mic-btn" class="icon-btn" title="Hold or tap to talk" aria-label="Speech to text">🎤</button>
        <textarea id="input" rows="1" placeholder="Message Grok… (or use mic)" enterkeyhint="send"></textarea>
        <button id="send-btn" class="primary icon-btn" title="Send">➤</button>
      </div>
      <div class="composer-meta">
        <select id="project-select" title="Project cwd for new sessions"></select>
        <button id="cancel-btn" class="ghost small hidden">Cancel</button>
        <span id="cwd-label" class="muted small"></span>
      </div>
    </footer>
  </div>

  <!-- cache-bust when UI changes; marked optional, app.js has a built-in fallback -->
  <script src="/static/vendor/marked.min.js?v=2"></script>
  <script src="/static/vendor/purify.min.js?v=2"></script>
  <script src="/static/app.js?v=11"></script>
</body>
</html>
